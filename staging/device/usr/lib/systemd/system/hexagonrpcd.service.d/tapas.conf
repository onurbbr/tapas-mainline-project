# Debian's hexagonrpcd wrapper defaults hexagonrpcd_fw_dir to
# /var/lib/droid-juicer/sensors, which only exists on devices prepared by
# droid-juicer. tapas ships its Snapdragon Sensor Core payload in the firmware
# package instead, so point the daemon at it. The wrapper's other defaults
# (-f /dev/fastrpc-adsp -d adsp -s) already match this board.
[Service]
Environment=hexagonrpcd_fw_dir=/usr/share/qcom/sm6225/Xiaomi/tapas
