[Unit]
# graphical.target pulls greetd in directly, so ordering the gate before the
# target does not delay the greeter: both jobs start side by side and the
# target is only "reached" once they have both finished.  Order the greeter
# itself after the gate instead, so phosh's rotation manager and ambient
# brightness handler are built from a complete sensor set.
Wants=sensor-stack-ready.service
After=sensor-stack-ready.service
