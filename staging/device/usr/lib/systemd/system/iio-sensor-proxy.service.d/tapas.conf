# iio-sensor-proxy probes every sensor exactly once, at startup, and never
# retries a failed discovery: an SSC driver that cannot reach the DSP is
# dropped for the rest of the session. The proxy is pulled in by the FastRPC
# ADSP device unit, which appears as soon as the remoteproc is up, while
# hexagonrpcd - the daemon that serves the Snapdragon Sensor Core payload
# over the reverse tunnel - is a plain Type=simple unit with no readiness
# notification. It needs about a second to build the hexagonfs tree and to
# load the DSP side libraries, so a proxy started 10 ms behind it loses every
# sensor except the accelerometer.
#
# Pull hexagonrpcd in, start the proxy after it, and give the tunnel a few
# seconds to become usable before the one and only discovery pass runs.
[Unit]
Wants=hexagonrpcd.service
After=hexagonrpcd.service

[Service]
ExecStartPre=/bin/sleep 5
