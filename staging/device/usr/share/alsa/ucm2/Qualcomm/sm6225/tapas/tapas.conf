SectionUseCase."HiFi" {
	File "/Qualcomm/sm6225/tapas/tapas-HiFi.conf"
	Comment "HiFi quality Music"
}

#
# ---------------------------------------------------------------------------
# Voice Call verb - DISABLED
# ---------------------------------------------------------------------------
#
# tapas-VoiceCall.conf ships alongside this file but is not registered as a
# use case. ACP turns every registered verb into a card profile, so adding it
# would put a third entry in the desktop's card "Configuration" list next to
# the media profiles. Selecting that entry switches the whole session to call
# routing: the default sink becomes "Call audio", the default source becomes
# "Call microphone", and WirePlumber stores the choice in
# ~/.local/state/wireplumber/default-profile so it survives reboots, leaving
# media playing from the receiver.
#
# Call audio also does not work yet on its own: the DSP only offers the
# AudioReach VCPM voice graph and mainline has no graph builder for it. See
# staging/issues/voice-call.md.
#
# The verb itself is complete and its routing was verified by reading the
# mixer back: a single "Call" playback endpoint (earpiece by default) with
# the loudspeaker and the wired headset as modifiers, plus the handset
# microphone as its capture endpoint.
#
# TO ENABLE, once a call daemon exists that can drive the routing without
# exposing a card profile: uncomment the use case below.
#
# SectionUseCase."Voice Call" {
#	File "/Qualcomm/sm6225/tapas/tapas-VoiceCall.conf"
#	Comment "Voice call"
# }
#
# ---------------------------------------------------------------------------
#

BootSequence [
	cset "name='stream0.vol_ctrl0 MultiMedia1 Playback Volu' 8192"
	cset "name='HPHL Volume' 18"
	cset "name='HPHR Volume' 18"
	cset "name='RX_RX0 Digital Volume' 84"
	cset "name='RX_RX1 Digital Volume' 84"
	cset "name='RX_RX2 Digital Volume' 84"
]

Include.card-init.File "/lib/card-init.conf"
Include.ctl-remap.File "/lib/ctl-remap.conf"

