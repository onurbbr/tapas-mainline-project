#
# Xiaomi Redmi Note 12 4G (tapas) - HiFi verb
#
# Scope: ordinary media use. Exactly one playback device is offered at a
# time: the speaker, or the headphones once a cable is plugged in. Plugging
# a cable hides the speaker through "JackHWMute", so a desktop only ever
# lists the output that is actually in use.
#
# There is no earpiece device in this verb. The receiver belongs to call
# audio, which is owned by a separate voice-call use case so that media and
# call paths never fight over the same DAC.
#
# Capture follows the same rule as playback: one device at a time. The
# handset microphone on AMIC1 is the default; plugging in a headset with a
# microphone switches to the boom microphone on AMIC2 and hides the handset
# one. A plain stereo headset has no microphone pin, so the handset stays
# selected and nothing changes.
#
SectionVerb {
	Value {
		TQ "HiFi"
	}
	EnableSequence [
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 1"
		cset "name='stream0.vol_ctrl0 MultiMedia1 Playback Volu' 8192"
		cset "name='RX_RX0 Digital Volume' 84"
		cset "name='RX_RX1 Digital Volume' 84"
		cset "name='RX_RX2 Digital Volume' 84"
		cset "name='HPHL Volume' 18"
		cset "name='HPHR Volume' 18"

		# Common dual-path data graph: RX0 feeds INT0 (earpiece path)
		# and INT2 (speaker path). Same stream for both, like stock.
		cset "name='RX_MACRO RX0 MUX' AIF1_PB"
		cset "name='RX INT0_1 MIX1 INP0' RX0"
		cset "name='RX INT0 DEM MUX' CLSH_DSM_OUT"
		cset "name='RX INT2_1 MIX1 INP0' RX0"
		cset "name='RX_EAR Mode Switch' 1"
		# RDAC3_MUX=RX3: verified working earpiece path (see alsactl snapshot 2026-10-19 16:29)
		cset "name='RDAC3_MUX' RX3"

		# Keep both codec SWR RX ports in the SoundWire stream.
		cset "name='HPHL Switch' 1"
		cset "name='LO Switch' 1"
	]
	DisableSequence [
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 0"
	]
}

SectionDevice."Speaker" {
	Comment "Speaker playback"

	EnableSequence [
		cset "name='EAR_RDAC Switch' 0"
		cset "name='AUX_RDAC Switch' 1"
		cset "name='Speaker Switch' 1"
	]

	DisableSequence [
		cset "name='Speaker Switch' 0"
		cset "name='AUX_RDAC Switch' 0"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackSwitch "Speaker Switch"
	}
}

SectionDevice."Headphones" {
	Comment "Headphones playback"

	EnableSequence [
		cset "name='RX_HPH PWR Mode' LOHIFI"
		cset "name='RX_EAR Mode Switch' 0"
		cset "name='RX_MACRO RX0 MUX' AIF1_PB"
		cset "name='RX_MACRO RX1 MUX' AIF1_PB"
		cset "name='RX INT0_1 MIX1 INP0' RX0"
		cset "name='RX INT1_1 MIX1 INP0' RX1"
		cset "name='RX INT0 DEM MUX' CLSH_DSM_OUT"
		cset "name='RX INT1 DEM MUX' CLSH_DSM_OUT"
		cset "name='HPHL_RDAC Switch' 1"
		cset "name='HPHR_RDAC Switch' 1"
		cset "name='HPHL Switch' 1"
		cset "name='HPHR Switch' 1"
		cset "name='CLSH PA Switch' 1"
		cset "name='RX HPH Mode' CLS_H_LOHIFI"
		cset "name='Headphone Jack Switch' 1"
	]

	DisableSequence [
		cset "name='Headphone Jack Switch' 0"
		cset "name='HPHL_RDAC Switch' 0"
		cset "name='HPHR_RDAC Switch' 0"
		cset "name='HPHL Switch' 0"
		cset "name='HPHR Switch' 0"
		cset "name='CLSH PA Switch' 0"
		cset "name='RX HPH Mode' CLS_H_INVALID"
		cset "name='RX INT0_1 MIX1 INP0' ZERO"
		cset "name='RX INT1_1 MIX1 INP0' ZERO"
		cset "name='RX INT0 DEM MUX' NORMAL_DSM_OUT"
		cset "name='RX INT1 DEM MUX' NORMAL_DSM_OUT"
	]

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		PlaybackSwitch "Headphone Jack Switch"
		JackControl "Headphone Jack"
		# Hide the speaker while a cable is plugged in, so the desktop
		# only ever offers the output that is actually in use.
		JackHWMute "Speaker"
	}
}


#
# Internal microphone (handset mic on AMIC1).
#
# Verified signal path, end to end:
#
#   AMIC1 -> ADC1 -> ADC1_OUTPUT --SoundWire--> TX SWR_INPUT0
#         -> TX DEC0 MUX (SWR_MIC) -> TX SMIC MUX0 (SWR_MIC0)
#         -> TX_AIF1_CAP Mixer DEC0 -> TX_AIF1 CAP
#         -> TX_CODEC_DMA_TX_3 -> MultiMedia4 Mixer -> hw:0,3
#
# Notes on the individual settings:
#
#  * "ADC1_MIXER Switch" is the internal ADC1 output mixer. Without it the
#    DAPM chain stops at ADC1 ("Off in 1 out 0") and the TX macro never sees
#    a clock, which surfaces as a silent EIO from the capture PCM.
#
#  * "TX SMIC MUX0" takes SWR_MIC0..SWR_MIC11 on this SoC variant, NOT the
#    older ADC0..ADC3 names. SWR_MIC0 selects TX SWR_INPUT0, which the device
#    tree wires to ADC1_OUTPUT.
#
#  * Capture runs on MultiMedia4 / TX_CODEC_DMA_TX_3. MultiMedia3 is left
#    disconnected: the topology allows MultiMedia3 <- TX_CODEC_DMA_TX_3 as
#    well, but only the MultiMedia4 pairing produces data on this board.
#
#  * The second decimator stays parked on the DMIC path with no input
#    selected. Leaving it on SWR_MIC0 would make the right channel a copy of
#    the left one, which is what earlier revisions did as a workaround
#    before the headset microphone was wired up properly.
#

SectionDevice."Mic" {
	Comment "Internal microphone"

	EnableSequence [
		# wcd937x: unmute ADC1 and its output mixer.
		cset "name='ADC1 Switch' 1"
		cset "name='ADC1_MIXER Switch' 1"
		cset "name='ADC1 Volume' 12"

		# ADC3 is deliberately left alone. Its switch is not independent:
		# ADC2 and ADC3 share SoundWire slave port 2 and the same channel
		# mask in the driver's TX channel table, so clearing the ADC3
		# switch also clears the ADC2 data path even though the two
		# microphones are separate inputs.

		# tx-macro: decimator 0 takes the SoundWire mic path and reads
		# SWR_MIC0, which carries ADC1. Decimator 1 stays on the DMIC path
		# with no input selected and therefore contributes silence.
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' SWR_MIC0"
		cset "name='TX DEC1 MUX' MSM_DMIC"
		cset "name='TX SMIC MUX1' ZERO"

		# tx-macro: attach decimator 0 to the TX_AIF1 capture stream.
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='TX_AIF1_CAP Mixer DEC1' 0"

		# AudioReach topology: connect the capture front end to the backend.
		# Both channels are enabled because the capture PCM is stereo only.
		cset "name='MultiMedia4 Mixer TX_CODEC_DMA_TX_3' 1,1"
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 0,0"
	]

	DisableSequence [
		# Deliberately empty. ACP probes a card profile by opening the
		# capture PCM and closing it again, and the closing runs this
		# sequence.  Clearing the AudioReach route here makes the probe
		# fail, which drops the profile and leaves WirePlumber with a
		# dummy output; clearing the decimator mux leaves the following
		# real stream with no samples even though it opens fine.  alsactl
		# also stores this state at shutdown, so it would break the next
		# boot as well.  The routing is therefore left in place and the
		# next enable simply rewrites it.
	]

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},3"
		# No CaptureSwitch: ACP uses that control as the mute switch and
		# keeps it cleared unless the stream is explicitly unmuted, which
		# also closes the SoundWire port the microphone needs.
		JackHWMute "HeadsetMic"
	}
}

#
# Headset microphone (boom mic of a wired headset, on AMIC2).
#
# Verified signal path, end to end:
#
#   AMIC2 -> ADC2 MUX (INP2) -> ADC2 -> ADC2_OUTPUT
#         --SoundWire--> TX SWR_INPUT4
#         -> TX DEC0 MUX (SWR_MIC) -> TX SMIC MUX0 (SWR_MIC4)
#         -> TX_AIF1_CAP Mixer DEC0 -> TX_AIF1 CAP
#         -> TX_CODEC_DMA_TX_3 -> MultiMedia4 Mixer -> hw:0,3
#
#   The same slot is also routed into the second decimator (DEC1, SMIC MUX1)
#   so that both channels of the stereo capture PCM carry the microphone.
#
#  * The SoundWire slot number is (master port - 1) * 4 + channel - 1. The
#    device tree puts ADC2 on master port 2 with channel mask BIT(0), so the
#    master drives channel 1 and the TX macro input is SWR_MIC4, wired to
#    TX SWR_INPUT4. The vendor stack instead points "ADC2 ChMap" at TX2_CH2
#    and reads SWR_MIC5; both describe the same wire, but mainline derives
#    the master channel from the slave port mask and lands on channel 1.
#
#  * "ADC2 MUX" selects INP2, which is the pin the headset microphone is
#    wired to on this board. INP3 is not connected to anything.
#
#  * The handset microphone is switched off here, so the two capture devices
#    never mix their inputs.
#

SectionDevice."HeadsetMic" {
	Comment "Headset microphone"

	EnableSequence [
		cset "name='ADC2 Switch' 1"
		cset "name='ADC2_MIXER Switch' 1"
		cset "name='ADC2 Volume' 12"
		cset "name='ADC2 MUX' INP2"

		# The handset microphone must not leak into the headset capture.
		cset "name='ADC1 Switch' 0"
		cset "name='ADC1_MIXER Switch' 0"
		# ADC3 is left alone: it shares the ADC2 SoundWire port mask.

		# The boom microphone is a single channel: ADC2 delivers one channel
		# on SoundWire slot SWR_MIC4. The capture PCM is stereo, so the second
		# decimator is fed from the same slot as well. Both decimators then
		# carry the same signal and the recording is audible on both sides
		# instead of only on the left one.
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' SWR_MIC4"
		cset "name='TX DEC1 MUX' SWR_MIC"
		cset "name='TX SMIC MUX1' SWR_MIC4"

		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='TX_AIF1_CAP Mixer DEC1' 1"

		cset "name='MultiMedia4 Mixer TX_CODEC_DMA_TX_3' 1,1"
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 0,0"
	]

	DisableSequence [
		# Empty for the same reason as the internal microphone above.
	]

	Value {
		CapturePriority 200
		CapturePCM "hw:${CardId},3"
		# No CaptureSwitch, see the internal microphone above.
		JackControl "Mic Jack"
		JackHWMute "Mic"
	}
}
