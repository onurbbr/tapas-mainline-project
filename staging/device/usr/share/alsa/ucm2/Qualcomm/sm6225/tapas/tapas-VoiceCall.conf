#
# Xiaomi Redmi Note 12 4G (tapas) - Voice Call verb
#
# Scope: call audio. The call is owned by the telephony stack, so this verb
# deliberately exposes a single playback endpoint ("Call") instead of one
# endpoint per physical output. The earpiece is the default route; the
# speaker and the wired headset are UCM *modifiers* on top of that single
# endpoint, so a desktop never lists "Earpiece playback" and "Speaker
# playback" as separate outputs while a call is running.
#
#   set _enadev Call                      # start the call endpoint
#   set _enamod Speaker                   # earpiece -> speaker
#   set _dismod Speaker                   # speaker -> earpiece
#   set _enamod Headphones                # earpiece/speaker -> wired headset
#   set _dismod Headphones                # back to the earpiece
#   set _disdev Call                      # end the call endpoint
#
# Media playback uses MultiMedia1 through the HiFi verb. The call path uses
# MultiMedia2, which nothing else opens, so a call and a media stream can
# coexist without fighting over the same front end.
#
# IMPORTANT: call audio itself does not work yet. The DSP only offers the
# AudioReach VCPM voice graph and mainline has no VCPM graph builder, so the
# codec routing described here is all that can currently be exercised. See
# staging/issues/voice-call.md. The routing was verified by reading back the
# mixer and DAPM state; no call has produced audio on this port.
#

SectionVerb {
	Value {
		TQ "Voice Call"
	}
	EnableSequence [
		# Call playback front end: MultiMedia2 -> RX_CODEC_DMA_RX_0.
		# This route is also what lets ACP probe the profile: a playback
		# PCM cannot be opened while no front end to backend route is
		# enabled, and the card then falls back to the "off" profile.
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia2' 1"
		cset "name='stream1.vol_ctrl1 MultiMedia2 Playback Volu' 8192"

		cset "name='RX_RX0 Digital Volume' 84"
		cset "name='RX_RX1 Digital Volume' 84"
		cset "name='RX_RX2 Digital Volume' 84"
		cset "name='HPHL Volume' 18"
		cset "name='HPHR Volume' 18"

		# RX0 feeds both output interrupts: INT0 is the earpiece DAC path,
		# INT2 is the speaker path. The modifier picks which one is on.
		cset "name='RX_MACRO RX0 MUX' AIF1_PB"
		cset "name='RX INT0_1 MIX1 INP0' RX0"
		cset "name='RX INT0 DEM MUX' CLSH_DSM_OUT"
		cset "name='RX INT2_1 MIX1 INP0' RX0"
		cset "name='RX_EAR Mode Switch' 1"
		cset "name='RDAC3_MUX' RX3"

		# Keep both codec SoundWire RX ports in the stream.
		cset "name='HPHL Switch' 1"
		cset "name='LO Switch' 1"

		# Call capture front end: MultiMedia4 <- TX_CODEC_DMA_TX_3.
		# Same reasoning as above, for the capture PCM.
		cset "name='MultiMedia4 Mixer TX_CODEC_DMA_TX_3' 1,1"
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 0,0"
	]
	DisableSequence [
		# Nothing is torn down here on purpose. The front end to backend
		# routes stay enabled: alsactl stores the card at shutdown, and a
		# stored state with the routes cleared makes the next boot's
		# profile probe fail, which drops the whole card to "off" and
		# leaves the desktop with a dummy output.
	]
}

#
# The single playback endpoint. Defaults to the earpiece.
#
SectionDevice."Call" {
	Comment "Call audio"

	EnableSequence [
		# Earpiece path: RX3 into the EAR DAC, speaker and aux DAC off.
		cset "name='RX_EAR Mode Switch' 1"
		cset "name='RDAC3_MUX' RX3"
		cset "name='EAR_RDAC Switch' 1"
		cset "name='EAR_PA Volume' 16"
		cset "name='AUX_RDAC Switch' 0"
		cset "name='Speaker Switch' 0"
		cset "name='Receiver Switch' 1"
	]

	DisableSequence [
		cset "name='Receiver Switch' 0"
		cset "name='EAR_RDAC Switch' 0"
		cset "name='AUX_RDAC Switch' 0"
		cset "name='Speaker Switch' 0"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},1"
	}
}

#
# Speaker modifier: moves the call from the earpiece to the loudspeaker.
# Enabling it turns the EAR DAC and receiver off before the AUX DAC on, so
# the two outputs are never driven at the same time.
#
SectionModifier."Speaker" {
	Comment "Loudspeaker"

	SupportedDevice [
		"Call"
	]

	EnableSequence [
		cset "name='Receiver Switch' 0"
		cset "name='EAR_RDAC Switch' 0"
		cset "name='AUX_RDAC Switch' 1"
		cset "name='Speaker Switch' 1"
	]

	DisableSequence [
		cset "name='Speaker Switch' 0"
		cset "name='AUX_RDAC Switch' 0"
		cset "name='EAR_RDAC Switch' 1"
		cset "name='Receiver Switch' 1"
	]
}

#
# Wired headset modifier: no separate endpoint is created, the call simply
# leaves the phone's own outputs. The headset microphone is not used yet, so
# the call keeps capturing from the handset microphone through "Mic".
#
SectionModifier."Headphones" {
	Comment "Wired headset"

	SupportedDevice [
		"Call"
	]

	EnableSequence [
		cset "name='Receiver Switch' 0"
		cset "name='EAR_RDAC Switch' 0"
		cset "name='AUX_RDAC Switch' 0"
		cset "name='Speaker Switch' 0"

		cset "name='RX_HPH PWR Mode' LOHIFI"
		cset "name='RX_EAR Mode Switch' 0"
		cset "name='RX_MACRO RX0 MUX' AIF1_PB"
		cset "name='RX_MACRO RX1 MUX' AIF1_PB"
		cset "name='RX INT0_1 MIX1 INP0' RX0"
		cset "name='RX INT1_1 MIX1 INP0' RX1"
		cset "name='RX INT0 DEM MUX' CLSH_DSM_OUT"
		cset "name='RX INT1 DEM MUX' CLSH_DSM_OUT"
		cset "name='HPHL_RDAC Switch' 1"
		cset "name='HPHR_RDAC Switch' 1"
		cset "name='HPHL Switch' 1"
		cset "name='HPHR Switch' 1"
		cset "name='CLSH PA Switch' 1"
		cset "name='RX HPH Mode' CLS_H_LOHIFI"
		cset "name='Headphone Jack Switch' 1"
	]

	DisableSequence [
		cset "name='Headphone Jack Switch' 0"
		cset "name='HPHL_RDAC Switch' 0"
		cset "name='HPHR_RDAC Switch' 0"
		cset "name='HPHL Switch' 0"
		cset "name='HPHR Switch' 0"
		cset "name='CLSH PA Switch' 0"
		cset "name='RX HPH Mode' CLS_H_INVALID"
		cset "name='RX INT1_1 MIX1 INP0' ZERO"
		cset "name='RX INT1 DEM MUX' NORMAL_DSM_OUT"
		cset "name='RX_EAR Mode Switch' 1"
		cset "name='EAR_RDAC Switch' 1"
		cset "name='Receiver Switch' 1"
	]
}

#
# Call uplink. Identical to the HiFi microphone, see tapas-HiFi.conf for the
# full signal path description: AMIC1 -> ADC1 -> SoundWire -> DEC0/DEC1 ->
# TX_AIF1 CAP -> TX_CODEC_DMA_TX_3 -> MultiMedia4.
#
SectionDevice."Mic" {
	Comment "Call microphone"

	EnableSequence [
		cset "name='ADC1 Switch' 1"
		cset "name='ADC1_MIXER Switch' 1"
		cset "name='ADC1 Volume' 12"

		cset "name='ADC2 Switch' 0"
		cset "name='ADC3 Switch' 0"
		cset "name='ADC2_MIXER Switch' 0"

		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' SWR_MIC0"
		cset "name='TX DEC1 MUX' SWR_MIC"
		cset "name='TX SMIC MUX1' SWR_MIC0"

		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='TX_AIF1_CAP Mixer DEC1' 1"
	]

	DisableSequence [
		# The front end to backend route stays enabled on purpose, see
		# the note in the Verb DisableSequence.
		cset "name='TX_AIF1_CAP Mixer DEC1' 0"
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
		cset "name='TX SMIC MUX1' ZERO"
		cset "name='TX SMIC MUX0' ZERO"
		cset "name='TX DEC1 MUX' MSM_DMIC"
		cset "name='TX DEC0 MUX' MSM_DMIC"
		cset "name='ADC1_MIXER Switch' 0"
		cset "name='ADC1 Switch' 0"
	]

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},3"
		CaptureSwitch "ADC1 Switch"
	}
}
