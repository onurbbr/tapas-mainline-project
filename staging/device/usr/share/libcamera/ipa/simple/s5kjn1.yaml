  - Agc:
      # AEC luma target (8-bit linear) by lux index zone:
      # 0-200: 47 220-270: 46 290-320: 44 350-410: 37 420-460: 32 470-1000: 30
      # The brightest zone's, as a fraction of full scale:
      meanTarget: 0.1843
      # CamX's lux index, which selects the tables by lux index, from the
      # tuning's exposure table (expKneeEntries): exposure time (us) x gain
      # at index 250, and index steps per stop of scene brightness.
      lux:
        refProduct: 62301.1
        perStop: 23.4498
      # The longest exposure time (us) the tuning's exposure table reaches: the
      # frame is lengthened (vertical blanking) for it in the dark
      maxExposure: 200000
      # and the exposure time (us) the table has at each gain (pairs), which the
      # frame is lengthened along, as the stock AEC raises exposure with gain
      exposureByGain: [ 1, 38, 4, 20000, 8, 40000, 16, 50000, 64, 60000, 96, 70000, 256, 200000 ]
      # Histogram luma target, brightest zone (lux index 0-140): satRefHigh 130,
      # G ranges, ADRC gain; DRC gain by zone: 2.5 2.45 2.23 2.2 1.7 1.5 1.4 1
      histogram:
        satRef: 0.5098
        satRange: [ 0, 0.06 ]
        pushupRange: [ 0.01, 0.08 ]
        targetAdj: [ 0.9, 1.25 ]
        maxDrcGain: 2.5
        filter: 0.5
        # Dark boost: darkest G pixels' floor (darkRefLow 4.300000190734863 of 255), lifted by
        # the tone curve by at most maxDarkBoost more than the DRC gain
        darkRef: 0.0169
        darkRange: [ 0, 0.1 ]
        maxDarkBoost: 1.5
      # The luma target by lux index zone, blended across the gaps
      meanTargetLux:
        - lux: [ 0, 200 ]
          meanTarget: 0.1843
        - lux: [ 220, 270 ]
          meanTarget: 0.1804
        - lux: [ 290, 320 ]
          meanTarget: 0.1725
        - lux: [ 350, 410 ]
          meanTarget: 0.1451
        - lux: [ 420, 460 ]
          meanTarget: 0.1255
        - lux: [ 470, 1000 ]
          meanTarget: 0.1176
      # The histogram adjustment by lux index zone
      histogramLux:
        - lux: [ 0, 140 ]
