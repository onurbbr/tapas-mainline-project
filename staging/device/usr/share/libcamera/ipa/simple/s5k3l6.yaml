      # AEC luma target (8-bit linear) by lux index zone:
      # 0-100: 51 140-180: 50 280-290: 49 360-370: 48 400-900: 45
      # The brightest zone's, as a fraction of full scale:
      meanTarget: 0.2000
      # CamX's lux index, which selects the tables by lux index, from the
      # tuning's exposure table (expKneeEntries): exposure time (us) x gain
      # at index 250, and index steps per stop of scene brightness.
      lux:
        refProduct: 33111.5
        perStop: 23.4498
      # The longest exposure time (us) the tuning's exposure table reaches: the
      # frame is lengthened (vertical blanking) for it in the dark
      maxExposure: 100000
      # and the exposure time (us) the table has at each gain (pairs), which the
      # frame is lengthened along, as the stock AEC raises exposure with gain
      exposureByGain: [ 1, 20, 16, 30000, 32, 50000, 64, 83333, 96, 100000 ]
      # Histogram luma target, brightest zone (lux index 0-50): satRefHigh 220,
      # G ranges, ADRC gain; DRC gain by zone: 1.7 1.7 1.5 1.3 1.1
      histogram:
        satRef: 0.8627
        satRange: [ 0.02, 0.16 ]
        pushupRange: [ 0.02, 0.1 ]
        targetAdj: [ 1, 1 ]
        maxDrcGain: 1.7
        filter: 0
      # The luma target by lux index zone, blended across the gaps
      meanTargetLux:
        - lux: [ 0, 100 ]
          meanTarget: 0.2000
        - lux: [ 140, 180 ]
          meanTarget: 0.1961
        - lux: [ 280, 290 ]
          meanTarget: 0.1922
        - lux: [ 360, 370 ]
