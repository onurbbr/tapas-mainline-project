      # DRC tone mapping (tmc12_sw's anchor knee points), by DRC gain.
      # CamX applies 20% of it (in log) globally and the rest by local
      # tone mapping, which the soft ISP lacks: all of it applies here.
      drcCurve:
        maxRatio: 16
        anchors:
          - drcGain: 1
            tones: [ 0.300, 0.300, 1.000 ]
            darkBoost: 0.100
            darkBoostRatio: 1.000
          - drcGain: 100
            tones: [ 0.300, 0.300, 1.000 ]
            darkBoost: 0.100
            darkBoostRatio: 1.000
      # The same by lux index (tmc12's AEC regions), as Ccm's luxSets
      drcCurveLux:
        - lux: [ 1, 130 ]
          drcCurve:
            maxRatio: 16
            anchors:
              - drcGain: 1
                tones: [ 0.330, 0.340, 1.000 ]
                darkBoost: 0.100
