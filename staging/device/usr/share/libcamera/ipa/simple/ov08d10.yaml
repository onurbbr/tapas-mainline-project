  - Agc:
      # AEC luma target (8-bit linear) by lux index zone:
      # 0-180: 54 220-280: 49 320-350: 40 360-400: 35 430-1000: 34
      # The brightest zone's, as a fraction of full scale:
      meanTarget: 0.2118
      # CamX's lux index, which selects the tables by lux index, from the
      # tuning's exposure table (expKneeEntries): exposure time (us) x gain
      # at index 250, and index steps per stop of scene brightness.
      lux:
        refProduct: 82761.6
        perStop: 23.4498
      # The longest exposure time (us) the tuning's exposure table reaches: the
      # frame is lengthened (vertical blanking) for it in the dark
      maxExposure: 66667
      # and the exposure time (us) the table has at each gain (pairs), which the
      # frame is lengthened along, as the stock AEC raises exposure with gain
      exposureByGain: [ 1, 51, 4, 20000, 8, 30000, 16, 50000, 32, 60000, 64, 66667, 96, 66667 ]
      # Histogram luma target, brightest zone (lux index 0-100): satRefHigh 190,
      # G ranges, ADRC gain; DRC gain by zone: 2 1.9 1.8 1.75 1.65 1.5
      histogram:
        satRef: 0.7451
        satRange: [ 0, 0.1 ]
        pushupRange: [ 0, 0.12 ]
        targetAdj: [ 0.86, 1.4 ]
        maxDrcGain: 2
        filter: 0.5
      # The luma target by lux index zone, blended across the gaps
      meanTargetLux:
        - lux: [ 0, 180 ]
          meanTarget: 0.2118
        - lux: [ 220, 280 ]
          meanTarget: 0.1922
        - lux: [ 320, 350 ]
          meanTarget: 0.1569
        - lux: [ 360, 400 ]
          meanTarget: 0.1373
        - lux: [ 430, 1000 ]
          meanTarget: 0.1333
      # The histogram adjustment by lux index zone
      histogramLux:
        - lux: [ 0, 100 ]
          satRef: 0.7451
          satRange: [ 0, 0.1 ]
          pushupRange: [ 0, 0.12 ]
