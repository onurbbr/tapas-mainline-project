## Boot menu configuration for the SM6225 Xiaomi boards (tapas and topaz).
##
## Kept in /usr/share as the package documentation requires: files under
## /etc/u-boot-menu/conf.d/ belong to the local administrator.

# Name shown in the boot menu. The kernel version is appended by
# u-boot-update, so an old kernel stays recognisable after an upgrade.
U_BOOT_MENU_LABEL="Xiaomi Redmi Note 12 4G"

# Keep every installed kernel as an entry, newest first and therefore the
# default. Upgrading the kernel package adds the new one and leaves the old
# one selectable, so a bad kernel can still be escaped from the boot menu.
U_BOOT_ENTRIES="all"

# No rescue duplicate: it differs only in "single", and the board has no
# usable serial console to take advantage of it.
U_BOOT_ALTERNATIVES="default"

# The device tree is deliberately not named here. Leaving U_BOOT_FDT empty
# makes u-boot-update emit "fdtdir", and U-Boot then picks the file from
# $fdtfile. That is what lets one userspace serve both board ids: U-Boot
# reads the compatible of the device tree it was built with, which says
# "xiaomi,tapas" or "xiaomi,topaz", and sets $fdtfile accordingly. Naming a
# tree here would override that and pin every unit to one board.

# splash asks the initramfs to start plymouthd before the root filesystem is
# mounted, so the logo is on screen from the moment the kernel hands over. The
# theme itself is pinned in /etc/plymouth/plymouthd.conf by build-image.sh;
# without it plymouthd has no theme to draw and the screen stays black.
#
# The board boots with the same arguments the hand written boot script used:
# clk_ignore_unused and pd_ignore_unused keep the bootloader enabled clocks
# and power domains running, rootwait covers the storage probing order, and
# rw is what the root filesystem has always been mounted as.
U_BOOT_PARAMETERS="clk_ignore_unused pd_ignore_unused rootwait rw splash"

# Five seconds to pick an entry.
U_BOOT_TIMEOUT="50"
